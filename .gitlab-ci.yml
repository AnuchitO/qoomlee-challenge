stages:
  - build
  - update-manifest
  - promote

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  KUSTOMIZE_VERSION: "v5.4.3"
  OVERLAY_PATH: "infra/k8s/overlays/dev"

.build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

.update-manifest:
  stage: update-manifest
  image: alpine:latest
  retry: 2
  before_script:
    - apk add --no-cache curl git
    - curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" -o /tmp/kustomize.tar.gz
    - tar xz -C /usr/local/bin/ -f /tmp/kustomize.tar.gz
    - git config --global user.email "ci@noreply.gitlab"
    - git config --global user.name "GitLab CI"
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git fetch origin "${CI_DEFAULT_BRANCH}"
    - git checkout "${CI_DEFAULT_BRANCH}"
    - git pull --rebase origin "${CI_DEFAULT_BRANCH}"

# ── qoomlee-service ────────────────────────────────────────────────────────────

build:qoomlee:
  extends: .build
  rules:
    - changes:
        - .gitlab-ci.yml
        - services/qoomlee/**/*
        - infra/k8s/**/qoomlee/**/*
  script:
    - docker build --platform linux/amd64 -t "$CI_REGISTRY_IMAGE/qoomlee-service:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE/qoomlee-service:latest" services/qoomlee
    - docker push "$CI_REGISTRY_IMAGE/qoomlee-service:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/qoomlee-service:latest"

update-manifest:qoomlee:
  extends: .update-manifest
  needs: ["build:qoomlee"]
  rules:
    - changes:
        - .gitlab-ci.yml
        - services/qoomlee/**/*
        - infra/k8s/**/qoomlee/**/*
  script:
    - cd "${OVERLAY_PATH}"
    - kustomize edit set image "${CI_REGISTRY_IMAGE}/qoomlee-service:${CI_COMMIT_SHA}"
    - cd -
    - git add "${OVERLAY_PATH}/kustomization.yaml"
    - 'git diff --cached --quiet || git commit -m "ci: update qoomlee-service to ${CI_COMMIT_SHA} [skip ci]"'
    - 'git push origin HEAD:${CI_DEFAULT_BRANCH}'

# ── payment-service ────────────────────────────────────────────────────────────

build:payment:
  extends: .build
  rules:
    - changes:
        - .gitlab-ci.yml
        - services/payment/**/*
        - infra/k8s/**/payment/**/*
  script:
    - docker build --platform linux/amd64 -t "$CI_REGISTRY_IMAGE/payment-service:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE/payment-service:latest" services/payment
    - docker push "$CI_REGISTRY_IMAGE/payment-service:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/payment-service:latest"

update-manifest:payment:
  extends: .update-manifest
  needs: ["build:payment"]
  rules:
    - changes:
        - .gitlab-ci.yml
        - services/payment/**/*
        - infra/k8s/**/payment/**/*
  script:
    - cd "${OVERLAY_PATH}"
    - kustomize edit set image "${CI_REGISTRY_IMAGE}/payment-service:${CI_COMMIT_SHA}"
    - cd -
    - git add "${OVERLAY_PATH}/kustomization.yaml"
    - 'git diff --cached --quiet || git commit -m "ci: update payment-service to ${CI_COMMIT_SHA} [skip ci]"'
    - 'git push origin HEAD:${CI_DEFAULT_BRANCH}'

# ── web ────────────────────────────────────────────────────────────────────────

build:web:
  extends: .build
  rules:
    - changes:
        - .gitlab-ci.yml
        - app/web/**/*
        - infra/k8s/**/web/**/*
  script:
    - docker build --platform linux/amd64 --build-arg NEXT_PUBLIC_QOOMLEE_API_URL=https://team-00-qoomlee-api.anuchito.com --build-arg NEXT_PUBLIC_PAYMENT_API_URL=https://team-00-payment-api.anuchito.com --build-arg NEXT_PUBLIC_ENABLE_TEST_SCENARIOS=true -t "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE/web:latest" app/web
    - docker push "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/web:latest"

update-manifest:web:
  extends: .update-manifest
  needs: ["build:web"]
  rules:
    - changes:
        - .gitlab-ci.yml
        - app/web/**/*
        - infra/k8s/**/web/**/*
  script:
    - cd "${OVERLAY_PATH}"
    - kustomize edit set image "${CI_REGISTRY_IMAGE}/web:${CI_COMMIT_SHA}"
    - cd -
    - git add "${OVERLAY_PATH}/kustomization.yaml"
    - 'git diff --cached --quiet || git commit -m "ci: update web to ${CI_COMMIT_SHA} [skip ci]"'
    - 'git push origin HEAD:${CI_DEFAULT_BRANCH}'

# ── list dev image tags (run this first to find what SHA to promote) ───────────

list:dev-tags:
  stage: promote
  image: alpine:latest
  when: manual
  before_script:
    - apk add --no-cache git
    - git fetch origin "${CI_DEFAULT_BRANCH}"
    - git checkout "${CI_DEFAULT_BRANCH}"
  script:
    - echo "=== Current image tags in dev overlay ==="
    - grep -A1 "name:" infra/k8s/overlays/dev/kustomization.yaml | grep "newTag"
    - echo ""
    - echo "=== Recent promotions to prod ==="
    - git log --oneline --follow infra/k8s/overlays/prod/kustomization.yaml | head -10

# ── promote to prod ────────────────────────────────────────────────────────────
# Trigger manually: CI/CD → Pipelines → Run pipeline
# Set QOOMLEE_TAG, PAYMENT_TAG, WEB_TAG to the commit SHA to promote.
# Leave a variable empty to skip updating that service.

promote:prod:
  stage: promote
  image: alpine:latest
  when: manual
  variables:
    QOOMLEE_TAG: ""
    PAYMENT_TAG: ""
    WEB_TAG: ""
  before_script:
    - apk add --no-cache curl git
    - curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" -o /tmp/kustomize.tar.gz
    - tar xz -C /usr/local/bin/ -f /tmp/kustomize.tar.gz
    - git config --global user.email "ci@noreply.gitlab"
    - git config --global user.name "GitLab CI"
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git fetch origin "${CI_DEFAULT_BRANCH}"
    - git checkout "${CI_DEFAULT_BRANCH}"
    - git pull --rebase origin "${CI_DEFAULT_BRANCH}"
  script:
    - PROD_PATH="infra/k8s/overlays/prod"
    - test -n "${QOOMLEE_TAG}" && kustomize edit set image "${CI_REGISTRY_IMAGE}/qoomlee-service:${QOOMLEE_TAG}" --kustomization-file "${PROD_PATH}/kustomization.yaml" || true
    - test -n "${PAYMENT_TAG}" && kustomize edit set image "${CI_REGISTRY_IMAGE}/payment-service:${PAYMENT_TAG}" --kustomization-file "${PROD_PATH}/kustomization.yaml" || true
    - test -n "${WEB_TAG}" && kustomize edit set image "${CI_REGISTRY_IMAGE}/web:${WEB_TAG}" --kustomization-file "${PROD_PATH}/kustomization.yaml" || true
    - git add "${PROD_PATH}/kustomization.yaml"
    - 'git diff --cached --quiet || git commit -m "ci: promote to prod — qoomlee:${QOOMLEE_TAG} payment:${PAYMENT_TAG} web:${WEB_TAG} [skip ci]"'
    - 'git push origin HEAD:${CI_DEFAULT_BRANCH}'
