stages:
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_TAG: ${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}

.build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

build:qoomlee:
  extends: .build
  script:
    - docker build --platform linux/amd64
        -t "$CI_REGISTRY_IMAGE/qoomlee-service:$IMAGE_TAG"
        -t "$CI_REGISTRY_IMAGE/qoomlee-service:latest"
        services/qoomlee
    - docker push "$CI_REGISTRY_IMAGE/qoomlee-service:$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE/qoomlee-service:latest"

build:payment:
  extends: .build
  script:
    - docker build --platform linux/amd64
        -t "$CI_REGISTRY_IMAGE/payment-service:$IMAGE_TAG"
        -t "$CI_REGISTRY_IMAGE/payment-service:latest"
        services/payment
    - docker push "$CI_REGISTRY_IMAGE/payment-service:$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE/payment-service:latest"

build:web:
  extends: .build
  script:
    - docker build --platform linux/amd64
        -t "$CI_REGISTRY_IMAGE/web:$IMAGE_TAG"
        -t "$CI_REGISTRY_IMAGE/web:latest"
        app/web
    - docker push "$CI_REGISTRY_IMAGE/web:$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE/web:latest"

deploy:dev:
  stage: deploy
  image: bitnami/kubectl:latest
  only:
    - tags
  script:
    - |
      for svc in qoomlee-service payment-service web; do
        kubectl kustomize infra/k8s/overlays/dev | \
          sed "s|newTag:.*|newTag: $CI_COMMIT_TAG|g" | \
          kubectl apply -f -
      done
    - sed -i "s/newTag:.*/newTag: $CI_COMMIT_TAG/" infra/k8s/overlays/dev/kustomization.yaml
    - git config user.email "ci@gitlab.com"
    - git config user.name "GitLab CI"
    - git add infra/k8s/overlays/dev/kustomization.yaml
    - git commit -m "chore(k8s): deploy $CI_COMMIT_TAG to dev" || echo "No changes to commit"
    - git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:main
