# GitLab CI/CD pipeline for qoomlee-challenge.
#
# Flow:
#   - every push/MR        -> test
#   - push to `main`       -> build images, apply infra/terraform/envs/dev,
#                              deploy backend + frontend to the `dev` environment
#   - tag (or manual on     -> build images, apply infra/terraform/envs/prod,
#     `main`)                  deploy backend + frontend to the protected
#                              `prod` GitLab environment
#
# Auth to GCP uses Workload Identity Federation (no service account keys):
# the `id_tokens` keyword requests a GitLab OIDC token, which
# scripts/ci/gcp-auth.sh exchanges for short-lived GCP credentials.
# Deploy access to the VMs is via IAP SSH tunnel (no public port 22).
#
# Required CI/CD variables (Settings > CI/CD > Variables):
#   GCP_PROJECT_ID                  - target GCP project
#   GCP_WORKLOAD_IDENTITY_PROVIDER  - terraform output `workload_identity_provider`
#                                      from infra/terraform/project
#   GCP_SERVICE_ACCOUNT_EMAIL       - terraform output `ci_service_account_email`
#                                      from infra/terraform/project
#   TF_STATE_BUCKET                 - GCS bucket created by scripts/bootstrap.sh
#
# Masked + protected, scoped per environment (dev/prod) - rendered into the
# deployed .env by scripts/ci/deploy-backend.sh:
#   POSTGRES_QOOMLEE_DB, POSTGRES_PAYMENT_DB, POSTGRES_USER,
#   POSTGRES_PAYMENT_USER, POSTGRES_PASSWORD, OMISE_PUBLIC_KEY,
#   OMISE_SECRET_KEY, JWT_PUBLIC_KEY, INTERNAL_TOKEN
#
# One-time setup per fork: apply infra/terraform/project (manual,
# `infra:project` job below), then copy its outputs into
# GCP_WORKLOAD_IDENTITY_PROVIDER / GCP_SERVICE_ACCOUNT_EMAIL above.

stages:
  - test
  - build
  - infra
  - deploy

variables:
  GCP_REGION: asia-southeast1
  GCP_ZONE: asia-southeast1-a
  AR_REPO: qoomlee-images
  TF_VERSION: "1.5.7"

.gcp_id_token: &gcp_id_token
  id_tokens:
    GCP_ID_TOKEN:
      aud: https://iam.googleapis.com/${GCP_WORKLOAD_IDENTITY_PROVIDER}

# ============================================================== test =====

test:qoomlee:
  stage: test
  image: golang:1.26-alpine
  script:
    - cd services/qoomlee && go test ./... -count=1

test:payment:
  stage: test
  image: golang:1.26-alpine
  script:
    - cd services/payment && go test ./... -count=1

test:frontend:
  stage: test
  image: oven/bun:1
  script:
    - cd app/web && bun install --frozen-lockfile && bun run test

# ============================================================= build =====

.build_image: &build_image
  stage: build
  image: google/cloud-sdk:slim
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  <<: *gcp_id_token
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
  before_script:
    - apt-get update -qq && apt-get install -y -qq docker.io >/dev/null
    - source scripts/ci/gcp-auth.sh

build:qoomlee:
  <<: *build_image
  script:
    - ./scripts/ci/build-push.sh qoomlee-service services/qoomlee

build:payment:
  <<: *build_image
  script:
    - ./scripts/ci/build-push.sh payment-service services/payment

# ============================================================= infra =====

.terraform_image: &terraform_image
  image: google/cloud-sdk:slim
  <<: *gcp_id_token
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl unzip gettext-base >/dev/null
    - curl -fsSL -o /tmp/tf.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
    - unzip -q -o /tmp/tf.zip -d /usr/local/bin
    - source scripts/ci/gcp-auth.sh

# One-time (or rarely re-run) setup of the shared WIF pool, Artifact
# Registry repo and CI service account. Manual on purpose.
infra:project:
  <<: *terraform_image
  stage: infra
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - cd infra/terraform/project
    - terraform init -backend-config="bucket=${TF_STATE_BUCKET}"
    - terraform apply -auto-approve -var="project_id=${GCP_PROJECT_ID}" -var="gitlab_project_path=${CI_PROJECT_PATH}"

infra:dev:
  <<: *terraform_image
  stage: infra
  environment:
    name: dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - cd infra/terraform/envs/dev
    - terraform init -backend-config="bucket=${TF_STATE_BUCKET}"
    - terraform apply -auto-approve -var="project_id=${GCP_PROJECT_ID}" -var="state_bucket=${TF_STATE_BUCKET}"

infra:prod:
  <<: *terraform_image
  stage: infra
  environment:
    name: prod
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - cd infra/terraform/envs/prod
    - terraform init -backend-config="bucket=${TF_STATE_BUCKET}"
    - terraform apply -auto-approve -var="project_id=${GCP_PROJECT_ID}" -var="state_bucket=${TF_STATE_BUCKET}"

# ============================================================ deploy =====

deploy:backend:dev:
  <<: *terraform_image
  stage: deploy
  environment:
    name: dev
  needs:
    - build:qoomlee
    - build:payment
    - infra:dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - terraform -chdir=infra/terraform/envs/dev init -backend-config="bucket=${TF_STATE_BUCKET}"
    - ./scripts/ci/deploy-backend.sh dev

deploy:frontend:dev:
  <<: *terraform_image
  stage: deploy
  environment:
    name: dev
  needs:
    - infra:dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl unzip gettext-base >/dev/null
    - curl -fsSL -o /tmp/tf.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
    - unzip -q -o /tmp/tf.zip -d /usr/local/bin
    - curl -fsSL https://bun.sh/install | bash
    - export PATH="${HOME}/.bun/bin:${PATH}"
    - source scripts/ci/gcp-auth.sh
  script:
    - terraform -chdir=infra/terraform/envs/dev init -backend-config="bucket=${TF_STATE_BUCKET}"
    - ./scripts/ci/deploy-frontend.sh dev

deploy:backend:prod:
  <<: *terraform_image
  stage: deploy
  environment:
    name: prod
  needs:
    - build:qoomlee
    - build:payment
    - infra:prod
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - terraform -chdir=infra/terraform/envs/prod init -backend-config="bucket=${TF_STATE_BUCKET}"
    - ./scripts/ci/deploy-backend.sh prod

deploy:frontend:prod:
  <<: *terraform_image
  stage: deploy
  environment:
    name: prod
  needs:
    - infra:prod
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl unzip gettext-base >/dev/null
    - curl -fsSL -o /tmp/tf.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
    - unzip -q -o /tmp/tf.zip -d /usr/local/bin
    - curl -fsSL https://bun.sh/install | bash
    - export PATH="${HOME}/.bun/bin:${PATH}"
    - source scripts/ci/gcp-auth.sh
  script:
    - terraform -chdir=infra/terraform/envs/prod init -backend-config="bucket=${TF_STATE_BUCKET}"
    - ./scripts/ci/deploy-frontend.sh prod
