title = "Qoomlee gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Allow known test/example values"
paths = [
  '''\.env\.example$''',
  '''_test\.go$''',
  '''node_modules/''',
  '''(^|/)tests/''',
  '''(^|/)test-results/''',
  # k8s Secret template — contains only TODO placeholder base64 values, not real secrets
  '''infra/k8s/''',
  # Diagram and doc files — contain only illustrative example values
  '''diagrams/''',
]
regexes = [
  # Omise test-mode keys and tokens (publicly documented sandbox values, safe to commit)
  '''pkey_test_[a-zA-Z0-9]+''',
  '''skey_test_[a-zA-Z0-9]+''',
  '''tokn_test_[a-zA-Z0-9]+''',
]
