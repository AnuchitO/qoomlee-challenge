title = "Qoomlee gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Allow known test/example values"
paths = [
  '''\.env\.example$''',
  '''_test\.go$''',
  '''node_modules/''',
  '''(^|/)tests/''',
  '''(^|/)test-results/''',
]
regexes = [
  # Omise test-mode keys (publicly documented sandbox keys, safe to commit)
  '''pkey_test_[a-zA-Z0-9]+''',
  '''skey_test_[a-zA-Z0-9]+''',
]
