version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - gosec
    - staticcheck
    - errcheck
    - revive
    - govet
    - bodyclose
    - exhaustive
    - unused
    - ineffassign

  settings:
    gosec:
      excludes:
        - G104
    revive:
      rules:
        - name: exported
        - name: error-strings
        - name: error-naming
    exhaustive:
      default-signifies-exhaustive: true

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - bodyclose

formatters:
  enable:
    - gofmt
    - goimports
