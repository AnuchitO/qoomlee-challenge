version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-qoomlee}
      POSTGRES_USER:     ${POSTGRES_USER:-qoomlee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qoomlee}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qoomlee}"]
      interval: 5s
      timeout: 5s
      retries: 10

  flight-service:
    build: ./services/flight
    environment:
      PORT:           8081
      DB_HOST:        postgres
      DB_PORT:        5432
      DB_NAME:        ${POSTGRES_DB:-qoomlee}
      DB_USER:        ${POSTGRES_USER:-qoomlee}
      DB_PASS:        ${POSTGRES_PASSWORD:-qoomlee}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  booking-service:
    build: ./services/booking
    environment:
      PORT:           8082
      DB_HOST:        postgres
      DB_PORT:        5432
      DB_NAME:        ${POSTGRES_DB:-qoomlee}
      DB_USER:        ${POSTGRES_USER:-qoomlee}
      DB_PASS:        ${POSTGRES_PASSWORD:-qoomlee}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  payment-service:
    build: ./services/payment
    environment:
      PORT:                8084
      DB_HOST:             postgres
      DB_PORT:             5432
      DB_NAME:             ${POSTGRES_DB:-qoomlee}
      DB_USER:             ${POSTGRES_USER:-qoomlee}
      DB_PASS:             ${POSTGRES_PASSWORD:-qoomlee}
      BOOKING_SERVICE_URL: http://booking-service:8082
      OMISE_PUBLIC_KEY:    ${OMISE_PUBLIC_KEY}
      OMISE_SECRET_KEY:    ${OMISE_SECRET_KEY}
      JWT_PUBLIC_KEY:      ${JWT_PUBLIC_KEY}   # verifies incoming user JWTs only
      INTERNAL_TOKEN:      ${INTERNAL_TOKEN}   # sent to booking-service on PUT /status
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      booking-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


volumes:
  postgres_data:
