apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: qoomlee
spec:
  replicas: 2   # minimum 2 — required by challenge constraints
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          # TODO: replace with your actual image
          image: qoomlee/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: FLIGHT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: qoomlee-config
                  key: FLIGHT_SERVICE_URL
            - name: BOOKING_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: qoomlee-config
                  key: BOOKING_SERVICE_URL
            - name: PAYMENT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: qoomlee-config
                  key: PAYMENT_SERVICE_URL
          resources:
            # TODO: tune based on load test results
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          # api-gateway has no DB — both probes use /health/live (always 200)
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 2

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: qoomlee
spec:
  selector:
    app: api-gateway
  type: NodePort   # use LoadBalancer if on a cloud provider
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080   # access via http://$(minikube ip):30080

---
# Autoscale api-gateway when CPU > 70%
# Requires metrics-server: kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: qoomlee
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
