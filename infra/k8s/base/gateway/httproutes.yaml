---
# qoomlee booking API — hostname patched per overlay
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qoomlee-api
  labels:
    app: qoomlee
    team: team-00
spec:
  parentRefs:
    - name: qoomlee
  hostnames:
    - "api.example.com"
  rules:
    - backendRefs:
        - name: qoomlee
          port: 8082
---
# payment API — hostname patched per overlay
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: payment-api
  labels:
    app: payment
    team: team-00
spec:
  parentRefs:
    - name: qoomlee
  hostnames:
    - "payment.example.com"
  rules:
    - backendRefs:
        - name: payment
          port: 8084
---
# frontend SPA — hostname patched per overlay
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  labels:
    app: web
    team: team-00
spec:
  parentRefs:
    - name: qoomlee
  hostnames:
    - "app.example.com"
  rules:
    - backendRefs:
        - name: web
          port: 3000
