apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgweb
  labels:
    app: pgweb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgweb
  template:
    metadata:
      labels:
        app: pgweb
    spec:
      containers:
        - name: pgweb
          image: sosedoff/pgweb:latest
          ports:
            - containerPort: 8081
          env:
            - name: PGWEB_DATABASE_URL
              value: "postgresql://qoomlee:$(POSTGRES_PASSWORD)@postgres-qoomlee:5432/qoomlee?sslmode=disable"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qoomlee-secret
                  key: POSTGRES_PASSWORD
          command: ["/usr/bin/pgweb"]
          args:
            - "--bind=0.0.0.0"
            - "--listen=8081"
            - "--url=$(PGWEB_DATABASE_URL)"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
