apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgweb
  labels:
    app: pgweb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgweb
  template:
    metadata:
      labels:
        app: pgweb
    spec:
      initContainers:
        - name: generate-htpasswd
          image: httpd:2-alpine
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qoomlee-secret
                  key: POSTGRES_PASSWORD
          command: ["sh", "-c"]
          args:
            - htpasswd -cb /auth/.htpasswd admin "$POSTGRES_PASSWORD"
          volumeMounts:
            - name: auth
              mountPath: /auth
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 8081
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: auth
              mountPath: /auth
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
        - name: pgweb
          image: sosedoff/pgweb:latest
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: qoomlee-secret
                  key: DATABASE_URL
          command: ["sh", "-c"]
          args:
            - /usr/bin/pgweb --bind=127.0.0.1 --listen=8082 --url="$DATABASE_URL"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: nginx-conf
          configMap:
            name: pgweb-nginx-conf
        - name: auth
          emptyDir: {}
