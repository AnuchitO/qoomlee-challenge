apiVersion: v1
kind: ConfigMap
metadata:
  name: pgweb-nginx-conf
data:
  default.conf: |
    server {
        listen 8081;

        auth_basic "pgweb";
        auth_basic_user_file /auth/.htpasswd;

        location / {
            proxy_pass http://127.0.0.1:8082;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
