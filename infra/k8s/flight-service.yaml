apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-service
  namespace: qoomlee
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flight-service
  template:
    metadata:
      labels:
        app: flight-service
    spec:
      containers:
        - name: flight-service
          # TODO: replace with your actual image (e.g. registry.example.com/qoomlee/flight-service:latest)
          image: qoomlee/flight-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: PORT
              value: "8081"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: qoomlee-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: qoomlee-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: qoomlee-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: qoomlee-config
                  key: DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: qoomlee-secrets
                  key: DB_PASS
          resources:
            # TODO: tune based on load test results
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          # livenessProbe: lightweight — never checks DB, so a DB outage doesn't restart the pod
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          # readinessProbe: checks DB ping — pod removed from Service if DB is unreachable
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2

---
apiVersion: v1
kind: Service
metadata:
  name: flight-service
  namespace: qoomlee
spec:
  selector:
    app: flight-service
  ports:
    - port: 8081
      targetPort: 8081
