---
# Persistent storage for PostgreSQL data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: qoomlee
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: qoomlee
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: qoomlee-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: qoomlee-config
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qoomlee-secrets
                  key: DB_PASS
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command: [pg_isready, -U, qoomlee]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: [pg_isready, -U, qoomlee]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-sql
          configMap:
            name: postgres-init-sql

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: qoomlee
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

---
# ConfigMap that holds the schema + seed SQL files
# Run: kubectl create configmap postgres-init-sql \
#        --from-file=01_schema.sql=infra/db/01_schema.sql \
#        --from-file=02_seed.sql=infra/db/02_seed.sql \
#        -n qoomlee
# Or use the Makefile target: make k8s-init-db
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: qoomlee
# Files are loaded via: kubectl create configmap (see comment above)
# Do not add SQL inline here — use the Makefile target instead.
